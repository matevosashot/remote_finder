<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2728%27 fill=%27%23e9e9eb%27/%3E%3Cpath d=%27M32 32V4a28 28 0 0 1 26 18z%27 fill=%27%234caf50%27/%3E%3Cpath d=%27M32 32l26-10a28 28 0 0 1-12 34z%27 fill=%27%237e57c2%27/%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2710%27 fill=%27%23fff%27/%3E%3C/svg%3E">
<title>Disk Usage</title>
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/pages.css">
<link rel="stylesheet" href="/css/du.css">
<script src="/vendor/d3/d3.min.js"></script>
</head>
<body class="page">
<header class="page-bar">
  <div class="page-title"><span id="name"></span><span id="meta" class="muted"></span></div>
  <div class="spacer"></div>
  <div class="page-actions">
    <button class="btn small" id="scan-btn" type="button">Stop</button>
    <button class="btn small" id="rescan" type="button" title="Count everything again">Rescan</button>
    <span class="seg-text" id="metric" title="What to count">
      <button class="seg-btn" data-metric="disk" type="button" title="Allocated blocks, like du (what deleting frees)">Disk Usage</button>
      <button class="seg-btn" data-metric="apparent" type="button" title="File lengths, like du --apparent-size">Apparent Size</button>
    </span>
    <label class="du-depth" title="How many rings the chart shows">Depth
      <select id="depth"></select></label>
    <button class="btn small" id="archive-btn" type="button" disabled>Archive</button>
    <button class="btn small" id="undo" type="button" disabled>Undo</button>
    <button class="btn small" id="goto" type="button" title="Analyze another folder">Go to Folder…</button>
  </div>
</header>
<div id="path" class="page-path"></div>
<div class="tail-status" id="status"></div>
<main class="du-main">
  <section class="du-list view-host" id="list" tabindex="0"></section>
  <div class="du-split" id="split" title="Drag to resize"></div>
  <section class="du-chart" id="chart">
    <div class="du-stage" id="stage"></div>
    <div class="du-chart-bar">
      <span class="seg-text" id="chart-kind">
        <button class="seg-btn" data-kind="rings" type="button" title="Rings chart">Rings</button>
        <button class="seg-btn" data-kind="treemap" type="button" title="Treemap chart">Treemap</button>
      </span>
    </div>
  </section>
</main>
<section class="du-archive" id="archive"></section>
<div class="du-tip" id="tip" hidden></div>
<script type="module" src="/js/du.js"></script>
</body>
</html>
